<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Gestor | Secretaria Online</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./favicon.png">
</head>

<body>
  <div class="page">
    <header id="site-header"></header>

    <main class="main-container">
      <section class="page-section">

        <!-- TÍTULO DO PORTAL DO GESTOR -->
        <div class="section-header topo-gestor">
          <span class="badge">Portal do Gestor</span>
          <button class="button secondary btn-navegacao btn-padrao-portal" id="btnLogout">Sair</button>
        </div>

        <!-- BOTÕES -->
        <div class="actions-gestor">
          <button class="button btn-navegacao btn-padrao-portal" id="btnGestaoGeral" data-permissao="ALL">Administração Geral</button>
          <button class="button btn-navegacao btn-padrao-portal" id="btnMonografiaFinal" data-permissao="PARECER">Parecer Monog</button>
          <button class="button btn-navegacao btn-padrao-portal" id="btnCredencialPesquisa" data-permissao="CREDENCIAL">Parecer Cred</button>
          <button class="button btn-navegacao btn-padrao-portal" id="btnEstatisticas" data-permissao="ESTATISTICAS">Gerar Relatórios</button>

          <!-- NOVOS BOTÕES -->
          <button class="button btn-navegacao btn-padrao-portal" id="btnParecerTec" data-permissao="PARECER">Parecer Tema</button>
          <div id="acoesSupervisor" class="acoes-supervisor">
            <button class="button btn-navegacao btn-padrao-portal" id="btnAtribuirSuperv" data-permissao="ATRIBUIR_SUPERVISOR">
              Atribuir Superv</button>
            <button class="button btn-navegacao btn-padrao-portal" id="btnHomologarSuperv" data-permissao="ALL">Homologação Listas</button>
          </div>
        </div>


        <!-- CONTAINER PARA LISTAS E ESTATÍSTICAS (APARECE APENAS QUANDO CLICAR) -->
        <div id="estatisticasContainer" class="estatisticas-container" style="display:none;">

          <div class="estat-box">

            <div class="estat-row">
              <label for="tipoRelatorio">Selecione o tipo de relatório:</label>
              <select id="tipoRelatorio">
                <option value="">-- Selecione --</option>
                <option value="tema_total">Tema de monografia: Total</option>
                <option value="tema_homologados">Tema de monografia: Supervisores homologados</option>
                <option value="tema_nao_homologados">Tema de monografia: Não homologados</option>
                <option value="monografia_total">Versão final de monografia: Total</option>
                <option value="monografia_aprovadas">Versão final de monografia: Submissões aprovadas</option>
                <option value="cred_total">Credencial: Total</option>
                <option value="cred_aprovados">Credencial: Aprovados</option>
              </select>
            </div>

            <div class="estat-row">
              <label>Selecione o período:</label>
              <div class="estat-periodo">
                <input id="periodoInicio" type="date">
                <input id="periodoFim" type="date">
              </div>
            </div>

            <button id="btnBuscarEstatisticas" class="btn-simples btn-padrao-portal">Buscar</button>
            <div id="resultadoRelatorio" style="margin-top:15px;"></div>

          </div>

        </div>

        <!-- TABELA GERAL DAS GESTÕES (NÃO ALTERAR) -->
        <div id="atribuirSupervisorContainer" class="estatisticas-container" style="display:none;">
          <div class="estat-box">
            <div class="estat-row">
              <label for="departamentoSupervisor">Selecione o departamento:</label>
              <select id="departamentoSupervisor">
                <option value="">-- Selecione --</option>
                <option value="economia-gestao">Economia e Gestão</option>
                <option value="contabilidade-auditoria">Contabilidade e Auditoria</option>
              </select>
            </div>
            <button id="btnBuscarAtribuirSupervisor" class="btn-simples btn-padrao-portal">Buscar</button>
          </div>
        </div>

        <div id="tabelaGestaoGeral">
          <div id="loadingAtribuirSupervisor" class="loading-local" hidden>
            A carregar…
          </div>
        </div>

      </section>
    </main>
  </div>

  <script src="./js/main.js"></script>
  <!-- HEADER -->
  <script type="module">
    import { renderHeader } from './componentes/header.js';

    renderHeader(document.getElementById('site-header'));

    import './js/gestor.js';
  </script>
  <script type="module">
    import './js/auth.js';

    // Protege a página - verifica autenticação e permissões
    // Como os módulos ES6 são carregados de forma assíncrona, 
    // a função já estará disponível quando este código executar
    if (typeof window.protegerGestor === "function") {
      window.protegerGestor();
    } else {
      // Se por algum motivo o módulo não carregou, redireciona para segurança
      console.error("auth.js não carregou: protegerGestor não existe");
      window.location.href = "index.html";
    }

    // Adiciona evento ao botão de logout
    document.addEventListener("DOMContentLoaded", () => {
      const btnLogout = document.getElementById("btnLogout");
      if (btnLogout) {
        btnLogout.addEventListener("click", () => {
          if (typeof window.logoutGestor === "function") {
            window.logoutGestor();
          } else {
            console.error("Função logoutGestor não encontrada");
          }
        });
      }
    });
  </script>

</body>


</html>
