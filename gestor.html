<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Gestor | Secretaria Online</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./favicon.png">
</head>

<body>
  <div class="page">
    <header id="site-header"></header>

    <main class="main-container gestor-main">
      <div class="gestor-layout">
        <aside class="gestor-sidebar" aria-label="Menu principal do gestor">
          <div class="gestor-sidebar-topo">
            <p class="gestor-sidebar-label">Portal do Gestor</p>
          </div>

          <nav class="gestor-sidebar-nav" aria-label="Navegação do gestor">
            <button class="gestor-menu-item active" type="button" data-target-button="btnGestaoGeral" data-permissao="ALL">
              <span class="menu-icon" aria-hidden="true">🏠</span><span>Gestão Geral</span>
            </button>
            <button class="gestor-menu-item" type="button" data-target-button="btnMonografiaFinal" data-permissao="PARECER">
              <span class="menu-icon" aria-hidden="true">📘</span><span>Monografia Final</span>
            </button>
            <button class="gestor-menu-item" type="button" data-target-button="btnDefesa" data-permissao="DEFESAS">
              <span class="menu-icon" aria-hidden="true">🛡️</span><span>Defesa Monografia</span>
            </button>
            <button class="gestor-menu-item" type="button" data-target-button="btnCredencialPesquisa" data-permissao="CREDENCIAL">
              <span class="menu-icon" aria-hidden="true">🧪</span><span>Colecta de Dados</span>
            </button>
            <button class="gestor-menu-item" type="button" data-target-button="btnCredencialEstagio" data-permissao="CREDENCIAL">
              <span class="menu-icon" aria-hidden="true">📄</span><span>Pedido de Estágios</span>
            </button>
            <button class="gestor-menu-item" type="button" data-target-button="btnParecerTec" data-permissao="PARECER">
              <span class="menu-icon" aria-hidden="true">📝</span><span>Temas Monografia</span>
            </button>
            <button class="gestor-menu-item" type="button" data-target-button="btnAtribuirSuperv" data-permissao="ATRIBUIR_SUPERVISOR">
              <span class="menu-icon" aria-hidden="true">👥</span><span>Atribuir Supervisores</span>
            </button>
            <button class="gestor-menu-item" type="button" data-target-button="btnHomologarSuperv" data-permissao="ALL">
              <span class="menu-icon" aria-hidden="true">✅</span><span>Homologar Listas</span>
            </button>
            <button class="gestor-menu-item" type="button" data-target-button="btnPlanosAnaliticos" data-permissao="PLANOS_ANALITICOS">
              <span class="menu-icon" aria-hidden="true">📊</span><span>Planos Analíticos</span>
            </button>
            <button class="gestor-menu-item" type="button" data-target-button="btnEstatisticas" data-permissao="ESTATISTICAS">
              <span class="menu-icon" aria-hidden="true">📈</span><span>Gerar Relatórios</span>
            </button>
          </nav>

          <div class="gestor-sidebar-rodape">
            <div class="gestor-avatar" aria-hidden="true">G</div>
            <p id="sidebarUserName">Gestor</p>
          </div>
        </aside>

        <section class="page-section gestor-content">

        <!-- TÍTULO DO PORTAL DO GESTOR -->
        <div class="section-header topo-gestor">
          <span class="badge">Portal do Gestor</span>
          <button class="button secondary btn-navegacao btn-padrao-portal" id="btnLogout">Sair</button>
        </div>

        <h2 id="gestorSectionTitle" class="gestor-section-title">Gestão Geral</h2>

        <!-- BOTÕES -->
        <div class="actions-gestor navegacao-antiga-oculta" aria-hidden="true">
          <button class="button btn-navegacao btn-padrao-portal" id="btnGestaoGeral" data-permissao="ALL">Gestão Geral</button>
          <button class="button btn-navegacao btn-padrao-portal" id="btnMonografiaFinal" data-permissao="PARECER">Monografia Final</button>
          <button class="button btn-navegacao btn-padrao-portal" id="btnDefesa" data-permissao="DEFESAS">Defesa Monografia</button>
          <button class="button btn-navegacao btn-padrao-portal" id="btnCredencialPesquisa" data-permissao="CREDENCIAL">Colecta de Dados</button>
          <button class="button btn-navegacao btn-padrao-portal" id="btnCredencialEstagio" data-permissao="CREDENCIAL">Pedido de Estágios</button>
          <button class="button btn-navegacao btn-padrao-portal" id="btnEstatisticas" data-permissao="ESTATISTICAS">Gerar Relatórios</button>
          <button class="button btn-navegacao btn-padrao-portal" id="btnParecerTec" data-permissao="PARECER">Temas Monografia</button>
          <div id="acoesSupervisor" class="acoes-supervisor navegacao-antiga-oculta" aria-hidden="true">
            <button class="button btn-navegacao btn-padrao-portal" id="btnAtribuirSuperv" data-permissao="ATRIBUIR_SUPERVISOR">Atribuir Supervisores</button>
            <button class="button btn-navegacao btn-padrao-portal" id="btnHomologarSuperv" data-permissao="ALL">Homologar Listas</button>
            <button class="button btn-navegacao btn-padrao-portal" id="btnPlanosAnaliticos" data-permissao="PLANOS_ANALITICOS">Planos Analíticos</button>
          </div>
        </div>

        <div id="secaoDefesas" style="display:none;">
          <div class="tabela-scroll">
            <table class="tabela-gestao">
              <thead>
                <tr>
                  <th>Data de Submissão</th>
                  <th class="col-nome">Nome</th>
                  <th>Número de Estudante</th>
                  <th>Contacto 1</th>
                  <th>Contacto 2</th>
                  <th class="col-curso">Curso</th>
                  <th class="col-supervisor">Supervisor</th>
                  <th>Situação</th>
                  <th class="col-pdf">PDF</th>
                  <th class="col-acao">Acção</th>
                </tr>
              </thead>
              <tbody id="listaDefesas"></tbody>
            </table>
          </div>
          <div class="paginacao-defesas" role="navigation" aria-label="Paginação Defesas">
            <button id="btnDefesasPaginaAnterior" class="button btn-paginacao" type="button" aria-label="Página anterior">&lt;</button>
            <span id="infoPaginacaoDefesas" class="paginacao-info">1 de 1</span>
            <button id="btnDefesasPaginaSeguinte" class="button btn-paginacao" type="button" aria-label="Página seguinte">&gt;</button>
          </div>
        </div>

        <div id="modalEdicaoDefesa" class="defesa-modal-overlay" style="display:none;" aria-hidden="true">
          <div class="defesa-modal-box" role="dialog" aria-modal="true" aria-labelledby="defesaModalTitulo">
            <div class="defesa-modal-header">
              <h3 id="defesaModalTitulo" class="defesa-modal-title">Registo de Defesas</h3>
              <button id="btnFecharModalDefesa" type="button" class="defesa-modal-close" aria-label="Fechar">×</button>
            </div>

            <div class="defesa-modal-content">
              <div class="defesa-modal-grid">
                <div class="defesa-form-field full-row">
                  <label for="defesaNome">Nome</label>
                  <input id="defesaNome" type="text" readonly>
                </div>

                <div class="defesa-form-field full-row">
                  <label for="defesaSupervisor">Supervisor</label>
                  <input id="defesaSupervisor" type="text" readonly>
                </div>

                <div class="defesa-form-field full-row">
                  <label for="defesaSituacao">Situação</label>
                  <select id="defesaSituacao"></select>
                </div>
                <div class="defesa-form-field full-row defesa-form-field-situacao-acoes">
                  <button id="btnGuardarSituacaoDefesa" type="button">Actualizar</button>
                </div>
              </div>

              <section class="defesa-modal-section">
                <h4>Marcação de defesa</h4>
                <div class="defesa-modal-grid">
                  <div class="defesa-form-field">
                    <label for="defesaPresidente">Presidente</label>
                    <select id="defesaPresidente" required></select>
                  </div>
                  <div class="defesa-form-field">
                    <label for="defesaArguente">Arguente</label>
                    <select id="defesaArguente" required></select>
                  </div>
                  <div class="defesa-form-field">
                    <label for="defesaDataAgendada">Data agendada</label>
                    <input id="defesaDataAgendada" type="date" required>
                  </div>
                  <div class="defesa-form-field">
                    <label for="defesaHora">Hora</label>
                    <input id="defesaHora" type="time" required>
                  </div>
                  <div class="defesa-form-field full-row">
                    <label for="defesaSala">Sala</label>
                    <input id="defesaSala" type="text" required>
                  </div>
                </div>
              </section>
            </div>

            <div class="defesa-modal-actions">
              <button id="btnGuardarEdicaoDefesa" type="button">Agendar</button>
            </div>
          </div>
        </div>


        <!-- CONTAINER PARA LISTAS E ESTATÍSTICAS (APARECE APENAS QUANDO CLICAR) -->
        <div id="estatisticasContainer" class="estatisticas-container" style="display:none;">

          <div class="form-card">
            <div class="form-header">
              <h2>Gerar Relatórios</h2>
              <p>Selecione os parâmetros do relatório.</p>
            </div>

            <div class="form-grid">
              <div class="form-field full-row">
                <label for="tipoRelatorio">Selecione o tipo de relatório</label>
                <select id="tipoRelatorio">
                  <option value="">-- Selecione --</option>
                  <option value="tema_total">Tema de monografia: Total</option>
                  <option value="tema_homologados">Tema de monografia: Supervisores homologados</option>
                  <option value="tema_nao_homologados">Tema de monografia: Não homologados</option>
                  <option value="monografia_total">Versão final de monografia: Total</option>
                  <option value="monografia_aprovadas">Versão final de monografia: Submissões aprovadas</option>
                  <option value="cred_total">Credencial: Total</option>
                  <option value="cred_aprovados">Credencial: Aprovados</option>
                </select>
              </div>

              <div class="form-field full-row">
                <label for="periodoInicio">Data de início</label>
                <input id="periodoInicio" type="date">
              </div>

              <div class="form-field full-row">
                <label for="periodoFim">Data de fim</label>
                <input id="periodoFim" type="date">
              </div>

              <div class="form-actions">
                <button id="btnBuscarEstatisticas" type="button">Buscar</button>
              </div>
            </div>

            <div id="resultadoRelatorio" style="margin-top:15px;"></div>
          </div>

        </div>

        <!-- TABELA GERAL DAS GESTÕES (NÃO ALTERAR) -->
        <div id="tabelaGestaoGeral">
          <div id="loadingAtribuirSupervisor" class="loading-local" hidden>
            A carregar…
          </div>
        </div>

        </section>
      </div>
    </main>
  </div>

  <script src="./js/main.js"></script>
  <!-- HEADER -->
  <script type="module">
    import { renderHeader } from './componentes/header.js';

    renderHeader(document.getElementById('site-header'));

    import './js/gestor.js';
  </script>
  <script type="module">
    import './js/auth.js';

    // Protege a página - verifica autenticação e permissões
    // Como os módulos ES6 são carregados de forma assíncrona, 
    // a função já estará disponível quando este código executar
    if (typeof window.protegerGestor === "function") {
      window.protegerGestor();
    } else {
      // Se por algum motivo o módulo não carregou, redireciona para segurança
      console.error("auth.js não carregou: protegerGestor não existe");
      window.location.href = "index.html";
    }

    // Adiciona evento ao botão de logout
    document.addEventListener("DOMContentLoaded", () => {
      const btnLogout = document.getElementById("btnLogout");
      if (btnLogout) {
        btnLogout.addEventListener("click", () => {
          if (typeof window.logoutGestor === "function") {
            window.logoutGestor();
          } else {
            console.error("Função logoutGestor não encontrada");
          }
        });
      }
    });
  </script>

  <script type="module">
    const menuItems = Array.from(document.querySelectorAll('.gestor-menu-item'));
    const sectionTitle = document.getElementById('gestorSectionTitle');

    const setActiveMenu = (targetButtonId) => {
      menuItems.forEach((item) => {
        const active = item.dataset.targetButton === targetButtonId;
        item.classList.toggle('active', active);
        if (active && sectionTitle) {
          sectionTitle.textContent = item.textContent.trim();
        }
      });
    };

    const sincronizarVisibilidadeMenu = () => {
      menuItems.forEach((item) => {
        const target = document.getElementById(item.dataset.targetButton);
        if (!target) return;
        const hidden = target.style.display === 'none';
        item.style.display = hidden ? 'none' : '';
      });

      const activeVisible = menuItems.find((item) => item.classList.contains('active') && item.style.display !== 'none');
      if (!activeVisible) {
        const primeiroVisivel = menuItems.find((item) => item.style.display !== 'none');
        if (primeiroVisivel) {
          setActiveMenu(primeiroVisivel.dataset.targetButton);
        }
      }
    };

    menuItems.forEach((item) => {
      item.addEventListener('click', () => {
        const targetButtonId = item.dataset.targetButton;
        const targetButton = document.getElementById(targetButtonId);

        if (targetButton) {
          targetButton.click();
          setActiveMenu(targetButtonId);
        }
      });

      const targetButton = document.getElementById(item.dataset.targetButton);
      if (targetButton) {
        targetButton.addEventListener('click', () => {
          setActiveMenu(item.dataset.targetButton);
        });

        const observer = new MutationObserver(sincronizarVisibilidadeMenu);
        observer.observe(targetButton, { attributes: true, attributeFilter: ['style'] });
      }
    });

    const sidebarUserName = document.getElementById('sidebarUserName');
    const avatar = document.querySelector('.gestor-avatar');

    const atualizarNomeUtilizador = () => {
      const email = (window.userEmail || '').trim();
      if (!email || !sidebarUserName) return false;

      const nome = email.split('@')[0].replace(/[._-]+/g, ' ').trim();
      const nomeFormatado = nome
        .split(' ')
        .filter(Boolean)
        .map((parte) => parte.charAt(0).toUpperCase() + parte.slice(1))
        .join(' ');

      sidebarUserName.textContent = nomeFormatado || 'Gestor';

      if (avatar) {
        const iniciais = nomeFormatado
          .split(' ')
          .filter(Boolean)
          .slice(0, 2)
          .map((parte) => parte.charAt(0).toUpperCase())
          .join('') || 'G';
        avatar.textContent = iniciais;
      }

      return true;
    };

    sincronizarVisibilidadeMenu();
    if (!atualizarNomeUtilizador()) {
      const timer = setInterval(() => {
        if (atualizarNomeUtilizador()) {
          clearInterval(timer);
        }
      }, 400);

      setTimeout(() => clearInterval(timer), 6000);
    }
  </script>

</body>


</html>
