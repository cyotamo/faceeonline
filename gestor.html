<!DOCTYPE html>
<html lang="pt">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal do Gestor | Secretaria Online</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="apple-touch-icon" href="./favicon.png">
</head>

<body>
  <div class="page">
    <header id="site-header"></header>

    <main class="main-container">
      <section class="page-section">

        <!-- TÍTULO DO PORTAL DO GESTOR -->
        <div class="section-header topo-gestor">
          <span class="badge">Portal do Gestor</span>
          <button class="button secondary btn-navegacao btn-padrao-portal" id="btnLogout">Sair</button>
        </div>

        <!-- BOTÕES -->
        <div class="actions-gestor">
          <button class="button btn-navegacao btn-padrao-portal" id="btnGestaoGeral" data-permissao="ALL">Gestão Geral</button>
          <button class="button btn-navegacao btn-padrao-portal" id="btnMonografiaFinal" data-permissao="PARECER">Monografia Final</button>
          <button class="button btn-navegacao btn-padrao-portal" id="btnDefesa" data-permissao="ALL">Defesa</button>
          <button class="button btn-navegacao btn-padrao-portal" id="btnCredencialPesquisa" data-permissao="CREDENCIAL">Colecta de Dados</button>
          <button class="button btn-navegacao btn-padrao-portal" id="btnCredencialEstagio" data-permissao="CREDENCIAL">Pedido de Estágios</button>
          <button class="button btn-navegacao btn-padrao-portal" id="btnEstatisticas" data-permissao="ESTATISTICAS">Gerar Relatórios</button>
          <button class="button btn-navegacao btn-padrao-portal" id="btnParecerTec" data-permissao="PARECER">Temas Monografia</button>
          <div id="acoesSupervisor" class="acoes-supervisor">
            <button class="button btn-navegacao btn-padrao-portal" id="btnAtribuirSuperv" data-permissao="ATRIBUIR_SUPERVISOR">Atribuir Supervisores</button>
            <button class="button btn-navegacao btn-padrao-portal" id="btnHomologarSuperv" data-permissao="ALL">Homologar Listas</button>
            <button class="button btn-navegacao btn-padrao-portal" id="btnPlanosAnaliticos" data-permissao="ALL">Planos Analíticos</button>
          </div>
        </div>

        <div id="secaoDefesas" style="display:none;">
          <div class="tabela-scroll">
            <table class="tabela-gestao">
              <thead>
                <tr>
                  <th>Data de Submissão</th>
                  <th class="col-nome">Nome</th>
                  <th>Número de Estudante</th>
                  <th>Contacto 1</th>
                  <th>Contacto 2</th>
                  <th class="col-curso">Curso</th>
                  <th class="col-supervisor">Supervisor</th>
                  <th>Situação</th>
                  <th class="col-pdf">PDF</th>
                  <th class="col-acao">Acção</th>
                </tr>
              </thead>
              <tbody id="listaDefesas"></tbody>
            </table>
          </div>
        </div>

        <div id="modalEdicaoDefesa" class="defesa-modal-overlay" style="display:none;" aria-hidden="true">
          <div class="defesa-modal-box" role="dialog" aria-modal="true" aria-labelledby="defesaModalTitulo">
            <div class="defesa-modal-header">
              <h3 id="defesaModalTitulo" class="defesa-modal-title">Editar registo de defesa</h3>
              <button id="btnFecharModalDefesa" type="button" class="defesa-modal-close" aria-label="Fechar">×</button>
            </div>

            <div class="defesa-modal-content">
              <div class="defesa-modal-grid">
                <div class="defesa-form-field full-row">
                  <label for="defesaNome">Nome</label>
                  <input id="defesaNome" type="text" readonly>
                </div>

                <div class="defesa-form-field full-row">
                  <label for="defesaSupervisor">Supervisor</label>
                  <input id="defesaSupervisor" type="text" readonly>
                </div>

                <div class="defesa-form-field full-row">
                  <label for="defesaSituacao">Situação</label>
                  <select id="defesaSituacao"></select>
                  <button id="btnGuardarSituacaoDefesa" type="button">Guardar</button>
                </div>
              </div>

              <section class="defesa-modal-section">
                <h4>Marcação de defesa</h4>
                <div class="defesa-modal-grid">
                  <div class="defesa-form-field">
                    <label for="defesaPresidente">Presidente</label>
                    <select id="defesaPresidente"></select>
                  </div>
                  <div class="defesa-form-field">
                    <label for="defesaArguente">Arguente</label>
                    <select id="defesaArguente"></select>
                  </div>
                  <div class="defesa-form-field full-row">
                    <label for="defesaDataAgendada">Data agendada</label>
                    <input id="defesaDataAgendada" type="date">
                  </div>
                </div>
              </section>
            </div>

            <div class="defesa-modal-actions">
              <button id="btnGuardarEdicaoDefesa" type="button" class="button btn-padrao-portal">Guardar</button>
              <button id="btnCancelarEdicaoDefesa" type="button" class="button secondary btn-padrao-portal">Cancelar</button>
            </div>
          </div>
        </div>


        <!-- CONTAINER PARA LISTAS E ESTATÍSTICAS (APARECE APENAS QUANDO CLICAR) -->
        <div id="estatisticasContainer" class="estatisticas-container" style="display:none;">

          <div class="form-card">
            <div class="form-header">
              <h2>Gerar Relatórios</h2>
              <p>Selecione os parâmetros do relatório.</p>
            </div>

            <div class="form-grid">
              <div class="form-field full-row">
                <label for="tipoRelatorio">Selecione o tipo de relatório</label>
                <select id="tipoRelatorio">
                  <option value="">-- Selecione --</option>
                  <option value="tema_total">Tema de monografia: Total</option>
                  <option value="tema_homologados">Tema de monografia: Supervisores homologados</option>
                  <option value="tema_nao_homologados">Tema de monografia: Não homologados</option>
                  <option value="monografia_total">Versão final de monografia: Total</option>
                  <option value="monografia_aprovadas">Versão final de monografia: Submissões aprovadas</option>
                  <option value="cred_total">Credencial: Total</option>
                  <option value="cred_aprovados">Credencial: Aprovados</option>
                </select>
              </div>

              <div class="form-field full-row">
                <label for="periodoInicio">Data de início</label>
                <input id="periodoInicio" type="date">
              </div>

              <div class="form-field full-row">
                <label for="periodoFim">Data de fim</label>
                <input id="periodoFim" type="date">
              </div>

              <div class="form-actions">
                <button id="btnBuscarEstatisticas" type="button">Buscar</button>
              </div>
            </div>

            <div id="resultadoRelatorio" style="margin-top:15px;"></div>
          </div>

        </div>

        <!-- TABELA GERAL DAS GESTÕES (NÃO ALTERAR) -->
        <div id="tabelaGestaoGeral">
          <div id="loadingAtribuirSupervisor" class="loading-local" hidden>
            A carregar…
          </div>
        </div>

      </section>
    </main>
  </div>

  <script src="./js/main.js"></script>
  <!-- HEADER -->
  <script type="module">
    import { renderHeader } from './componentes/header.js';

    renderHeader(document.getElementById('site-header'));

    import './js/gestor.js';
  </script>
  <script type="module">
    import './js/auth.js';

    // Protege a página - verifica autenticação e permissões
    // Como os módulos ES6 são carregados de forma assíncrona, 
    // a função já estará disponível quando este código executar
    if (typeof window.protegerGestor === "function") {
      window.protegerGestor();
    } else {
      // Se por algum motivo o módulo não carregou, redireciona para segurança
      console.error("auth.js não carregou: protegerGestor não existe");
      window.location.href = "index.html";
    }

    // Adiciona evento ao botão de logout
    document.addEventListener("DOMContentLoaded", () => {
      const btnLogout = document.getElementById("btnLogout");
      if (btnLogout) {
        btnLogout.addEventListener("click", () => {
          if (typeof window.logoutGestor === "function") {
            window.logoutGestor();
          } else {
            console.error("Função logoutGestor não encontrada");
          }
        });
      }
    });
  </script>

</body>


</html>
