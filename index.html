<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secretaria Online</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1e88e5">

<link rel="icon" href="/favicon.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<link rel="stylesheet" href="./css/style.css">

<meta property="og:title" content="Secretaria Online FACEE">
<meta property="og:description" content="Portal académico de submissão e gestão de trabalhos">
<meta property="og:image" content="https://seconlinefacee.web.app/og-image.png">
<meta property="og:url" content="https://seconlinefacee.web.app/">
<meta property="og:type" content="website">

<meta name="twitter:image" content="https://seconlinefacee.web.app/og-image.png">



  <style></style>
</head>
<body>
  <div class="page">
    <header id="site-header"></header>

    <main class="hero">
      <section class="cta">
        <h1 class="title">Secretaria Online</h1>
        <p class="subtitle">
          Escolha o seu portal e aceda rapidamente aos serviços da faculdade.
        </p>

        <div class="actions">
          <a class="cta-button" href="./aluno.html">Estudantes</a>
          <a class="cta-button" href="./docente.html">Docentes</a>
          <button id="btnGestores" class="cta-button btn-portal">Gestores</button>


        </div>
      </section>
    </main>
  </div>

  <div id="modalLogin" class="login-modal-overlay">
    <div class="login-modal-box">
      <h2 class="login-modal-title">Login de Gestores</h2>
      <p class="login-modal-subtitle">Aceda à área administrativa</p>
      <form class="login-form">
        <div class="login-input-group">
          <label for="emailGestor">Email</label>
          <input type="email" id="emailGestor" placeholder="seu@email.com" required>
        </div>
        <div class="login-input-group">
          <label for="senhaGestor">Senha</label>
          <input type="password" id="senhaGestor" placeholder="••••••••" required>
        </div>
        <div id="loginErro" class="login-erro">
          Email ou senha inválidos
        </div>
        <button type="submit" id="btnEntrarGestor" class="login-submit-btn">Entrar</button>
      </form>
    </div>
  </div>

  <!-- Component Header -->
  <script type="module">
    import { renderHeader } from './componentes/header.js';
    renderHeader(document.getElementById('site-header'));
  </script>

  <script type="module">
    import './js/auth.js';
    
    document.addEventListener("DOMContentLoaded", () => {
      const btnGestores = document.getElementById("btnGestores");
      const modal = document.getElementById("modalLogin");
      const loginForm = document.querySelector(".login-form");
      const loginInputs = document.querySelectorAll(".login-form input");

      if (!btnGestores) {
        console.error("Botão btnGestores não encontrado");
        return;
      }

      if (!modal) {
        console.error("Modal modalLogin não encontrado");
        return;
      }

      btnGestores.addEventListener("click", async () => {
        // Verifica se o usuário já está logado
        if (typeof window.verificarAutenticacaoGestor === "function") {
          const estaLogado = await window.verificarAutenticacaoGestor();
          if (estaLogado) {
            // Usuário já está logado, redireciona direto
            window.location.href = "gestor.html";
            return;
          }
        }
        // Usuário não está logado, mostra o modal de login
        window.esconderErroLogin?.();
        modal.style.display = "flex";
      });

      // Fechar modal ao clicar fora
      modal.addEventListener("click", (e) => {
        if (e.target === modal) {
          modal.style.display = "none";
        }
      });

      // Fechar modal com ESC
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && modal.style.display === "flex") {
          modal.style.display = "none";
        }
      });

      // Handler do formulário
      if (loginForm) {
        loginForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const email = document.getElementById("emailGestor").value;
          const senha = document.getElementById("senhaGestor").value;
          if (email && senha) {
            loginGestor(email, senha);
          }
        });
      }

      if (loginInputs.length) {
        loginInputs.forEach((input) => {
          input.addEventListener("input", () => {
            window.esconderErroLogin?.();
          });
        });
      }
    });
  </script>

  <script type="module">
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/service-worker.js")
      .then(() => console.log("SW activo"))
      .catch((err) => console.log(err));
    }
  </script>

  <script type="module" src="./js/firebase.js"></script>

</body>
</html>
